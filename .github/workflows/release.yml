name: Release

# Obsidian's community store and BRAT both install from a GitHub release whose assets are
# the three built files at the top level — not from a tag, and not from a zip. Attaching them
# by hand is how a release ends up half-published.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  # Provenance attestation is a signed claim that these exact bytes came out of this workflow,
  # on this repo, at this commit. `id-token` mints the OIDC token that identifies the run to
  # Sigstore; `attestations` lets the result be written back to the repo. Both are required —
  # with either missing the attest step fails rather than degrading.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Verify the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi

      # Attest *before* the release is created, so there is no window in which the assets are
      # downloadable but unverifiable. Only the built assets are listed: manifest.json is source,
      # committed and reviewable in the tree, so a provenance claim over it would assert nothing
      # the tag does not already. Users verify with:
      #   gh attestation verify main.js --repo kpndevroot/obsidian-basalt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            main.js manifest.json styles.css
